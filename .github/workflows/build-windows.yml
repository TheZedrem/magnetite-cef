name: Build CEF for Windows (experiment)
run-name: CEF ${{ inputs.cef_version }} for Windows (experiment)

# An untested experiment: builds CEF for Windows on x86_64 on our Linux
# runner, with Chromium's cross build (README, "Windows, built on Linux").
# What takes long runs on our runner, what is quick and needs Windows on
# GitHub's:
#
#   toolchain  GitHub's Windows  packages Visual Studio and the Windows SDK
#   build      our Linux runner  checks out, builds, makes the distribution
#   check      GitHub's Windows  loads the distribution's libcef.dll
#
# It releases nothing: the distribution is an artifact of the run. The work
# is in tools/build-cef.sh.

on:
  workflow_dispatch:
    inputs:
      cef_version:
        description: Full CEF version, as in cef_binary_<version>
        required: true
        default: 156.0.30+g6028375+chromium-156.0.8078.96
      toolchain:
        description: Package Visual Studio and the Windows SDK (the first run; after that when the build asks for it)
        type: boolean
        default: false
      fresh:
        description: Delete the tree on the runner and check out from zero (when an update of it failed)
        type: boolean
        default: false

permissions: {}

# One build at a time, the release builds of build.yml included: they share
# the Linux runner.
concurrency:
  group: build-cef
  cancel-in-progress: false

env:
  CEF_VERSION: ${{ inputs.cef_version }}
  CEF_TARGET: windows64

jobs:
  # As in build.yml: a reviewer of the environment "build" approves the run,
  # and the environment takes main only.
  approve:
    name: Wait for approval
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: build
    steps:
      - run: "true"

  toolchain:
    name: Package Visual Studio
    needs: approve
    if: github.ref == 'refs/heads/main' && inputs.toolchain
    # The image with the Visual Studio Chromium wants (2026).
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package Visual Studio and the Windows SDK, encrypted
        env:
          WIN_TOOLCHAIN_KEY: ${{ secrets.WIN_TOOLCHAIN_KEY }}
        run: tools/build-cef.sh win-toolchain

      # Anyone can download an artifact of a public repository: this one is
      # encrypted, and gone after a day.
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-toolchain
          path: ${{ runner.temp }}/win-toolchain/
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    name: Build for Windows
    needs: [approve, toolchain]
    # Also when the toolchain job was skipped: the package of an earlier run
    # is on the runner.
    if: ${{ !cancelled() && needs.approve.result == 'success' && needs.toolchain.result != 'failure' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    # Read only, as in build.yml.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package of Visual Studio
        if: inputs.toolchain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: win-toolchain
          path: ${{ runner.temp }}/win-toolchain

      # The key is for this step only: the build runs code it downloads.
      - name: Take the package
        if: inputs.toolchain
        env:
          WIN_TOOLCHAIN_KEY: ${{ secrets.WIN_TOOLCHAIN_KEY }}
        run: tools/build-cef.sh win-toolchain-unpack

      # The tree stays in ~/cef-windows64 on the runner.
      - name: Check out or update the tree, build, make the distribution
        env:
          CEF_FRESH: ${{ inputs.fresh }}
        run: tools/build-cef.sh local

      - name: Upload the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cef-distrib-windows64
          path: ${{ runner.temp }}/cef-distrib/
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  check:
    name: Load it on Windows
    needs: build
    # Stated, or a skipped toolchain job would skip this one too.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cef-distrib-windows64
          path: ${{ runner.temp }}/cef-distrib

      - name: Check the archive and load libcef.dll
        run: tools/build-cef.sh win-check
